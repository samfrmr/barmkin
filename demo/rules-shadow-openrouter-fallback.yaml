# Dynamic-hooks demo: Phase 2, shadow mode - ISOLATED-TESTING FALLBACK.
#
# This is the Tier B path: direct egress to OpenRouter with a local
# per-user key. Per the captain's 2026-10-01 revision, the production
# posture is Tier A (demo/rules-shadow.yaml, an internal gateway in
# front of a self-hosted model) - use this file only when you want to
# exercise a real Jev round trip in isolation, without a gateway.
#
# Shadow mode calls Jev, logs the outcome it WOULD act on, and always
# passes - this is how a dynamic layer gets calibrated before anyone
# trusts it to block anything. See demo/README.md.

rules:
  - name: "rm-rf-force"
    pattern: 'rm\s+-rf\b'
    reason: "Recursive force-delete"
    example: "rm -rf /tmp/foo"

  - name: "test-deny"
    pattern: 'BARMKIN-TEST-DENY'
    reason: "Test vector (expected deny)"
    example: "touch BARMKIN-TEST-DENY"

log:
  path: "./demo/out/shadow-openrouter.log"

dynamic:
  enabled: true
  mode: shadow
  provider:
    base_url: "https://openrouter.ai/api"   # direct egress, no corporate proxy/gateway (isolated-testing fallback)
    model: "jev-1.13"                       # pinned, per D1
    auth:
      type: bearer_file
      path: "./demo/jev.key"                # must be 0600; see demo/README.md
    redact: default                         # data leaves the corporate boundary here, so redact before egress
    timeout_ms: 1500
  gate:
    tools: ["bash"]
    permission_modes: ["auto", "bypassPermissions", "dontAsk"]
    skip_read_only: true
    skip_allow_rules: true
  on_unavailable: pass    # shadow default (D4, Phase 2)
  breaker:
    enabled: true
    open_after_failures: 1
    cooldown_s: 60
