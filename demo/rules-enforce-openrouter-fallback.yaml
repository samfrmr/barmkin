# Dynamic-hooks demo: Phase 3, enforce mode - ISOLATED-TESTING FALLBACK.
#
# This is the Tier B path: direct egress to OpenRouter with a local
# per-user key. Per the captain's 2026-10-01 revision, the production
# posture is Tier A (demo/rules-enforce.yaml, an internal gateway in
# front of a self-hosted model) - use this file only when you want to
# exercise a real Jev round trip in isolation, without a gateway.
#
# Enforce mode acts on the composition: a clear hazard rejection
# denies, a clear soft rejection escalates (Claude Code "ask", forcing
# a human prompt even in auto mode). When Jev is unreachable it fails
# closed-to-manual (escalate), with a per-session breaker that opens
# after one failure and then short-circuits - no network wait - until
# its cooldown elapses. See demo/README.md.

rules:
  - name: "rm-rf-force"
    pattern: 'rm\s+-rf\b'
    reason: "Recursive force-delete"
    example: "rm -rf /tmp/foo"

  - name: "test-deny"
    pattern: 'BARMKIN-TEST-DENY'
    reason: "Test vector (expected deny)"
    example: "touch BARMKIN-TEST-DENY"

log:
  path: "./demo/out/enforce-openrouter.log"

dynamic:
  enabled: true
  mode: enforce
  provider:
    base_url: "https://openrouter.ai/api"
    model: "jev-1.13"
    auth:
      type: bearer_file
      path: "./demo/jev.key"
    redact: default   # data leaves the corporate boundary here, so redact before egress
    timeout_ms: 1500
  gate:
    tools: ["bash"]
    permission_modes: ["auto", "bypassPermissions", "dontAsk"]
    skip_read_only: true
    skip_allow_rules: true
  on_unavailable: escalate       # fail-closed-to-manual (D4)
  on_unavailable_by_mode:
    bypassPermissions: deny      # until a human verifies hook "ask" is honoured there (report.md §5c)
  breaker:
    enabled: true
    open_after_failures: 1
    cooldown_s: 60
