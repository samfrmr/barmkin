# Opt-in drop-in for barmkin-monitor.service, installed as
# barmkin-monitor.service.d/admin.conf with barmkin-monitor-admin.socket: it
# passes the root-owned administrative socket to the monitor and turns it on
# with -admin-socket. Without this drop-in the monitor has no administrative
# socket, and nothing lowers a leg.

[Unit]
Requires=barmkin-monitor-admin.socket
After=barmkin-monitor-admin.socket

[Service]
Sockets=barmkin-monitor-admin.socket
ExecStart=
ExecStart=/usr/local/bin/barmkin monitor -socket /run/barmkin/monitor.sock -state-dir /var/lib/barmkin -client-group barmkin-clients -admin-socket /run/barmkin-admin/admin.sock
