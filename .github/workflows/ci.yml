name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The Go version comes from go.mod, so CI and the module agree.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go test runs node:test suites (the contract fixtures, and the shim's
      # monitor client against a real monitor), which need Node 22.18+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: go vet
        run: go vet ./...

      # Only Go files this change adds or modifies are checked, so older
      # files are not reformatted as a side effect.
      - name: gofmt (changed files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=$BASE_SHA
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^)
          fi
          unformatted=$(git diff --name-only -z --diff-filter=ACMR "$base"...HEAD -- '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test ./...

  # The Claude Code shim plugin, under the Claude Code release
  # plugins/claude-code/package.json pins: its manifest and hooks module
  # through `claude plugin validate --strict`, and its suite through
  # `claude plugin test`, against an in-memory monitor. No credential and no
  # network call beyond the npm install.
  shim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/claude-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the pinned Claude Code
        run: npm ci

      - name: claude plugin validate --strict
        run: npm run validate

      - name: claude plugin test
        run: npm test

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # Scans every commit reachable from HEAD. .gitleaks.toml allows only
      # the fake tokens used as rules.yaml examples.
      - name: gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --log-opts=HEAD .
